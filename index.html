<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Importância da Faculdade</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #ffd6e5;
      color: #5a3040;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: #fff5f8;
      width: 80%;
      max-width: 700px;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(150, 70, 100, 0.15);
    }

    h1 {
      color: #d65a87;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>A Importância da Faculdade</h1>

    <p>
      A faculdade é importante na vida adulta porque ajuda a desenvolver
      conhecimentos, habilidades e novas oportunidades profissionais.
      Além de preparar para o mercado de trabalho, ela também contribui
      para o crescimento pessoal, a responsabilidade e a realização de sonhos.
    </p>
  </div>

</body>
</html>
